name: Gerar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      # Gera as pastas do Android que faltam (não sobrescreve nossos arquivos)
      - run: flutter create --platforms=android --project-name led_control .
      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk LED-Control.apk
      # Publica o APK numa Release para baixar direto pelo celular
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: LED Control (build ${{ github.run_number }})
          files: LED-Control.apk
          make_latest: true
      - uses: actions/upload-artifact@v4
        with:
          name: led-control-apk
          path: build/app/outputs/flutter-apk/app-release.apk
